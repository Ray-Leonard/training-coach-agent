# Reference settings for the dedicated Hermes profile.
#
# Create/select the profile first:
#   hermes profile create trainingcoach --description "Private modular fitness coach"
#   hermes profile use trainingcoach
#   hermes profile show trainingcoach
#   hermes config edit
#
# Merge the settings below into the active profile config. Replace the placeholder
# with the absolute repository path; do not copy credentials into this file.

terminal:
  cwd: /absolute/path/to/training-coach-agent

skills:
  external_dirs:
    - /absolute/path/to/training-coach-agent/skills

# Start or resume the selected profile in the correct workspace:
#   hermes --in /absolute/path/to/training-coach-agent
#   hermes --in /absolute/path/to/training-coach-agent --resume latest
#
# Model/provider credentials stay in the Hermes profile. Select them interactively:
#   hermes model
