# Reference settings for the dedicated Hermes profile.
#
# Create/select the profile first:
#   hermes profile create trainingcoach --description "Private modular fitness coach"
#   hermes profile use trainingcoach
#   hermes profile show trainingcoach
#   hermes config edit
#
# Find the directory where you cloned this repository first:
#   cd /path/to/your/cloned/training-coach-agent
#   pwd
# Replace both placeholders below with that printed absolute path. Do not copy
# this example path literally, and do not copy credentials into this file.

terminal:
  cwd: /your/actual/clone/path/training-coach-agent

skills:
  external_dirs:
    - /your/actual/clone/path/training-coach-agent/skills

# Start or resume the selected profile in the correct workspace:
#   hermes --in /your/actual/clone/path/training-coach-agent
#   hermes --in /your/actual/clone/path/training-coach-agent --resume latest
#
# Model/provider credentials stay in the Hermes profile. Select them interactively:
#   hermes model
